<!DOCTYPE html>
<html lang="id">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Presensi SMKN 1 Sanden</title>

<link rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:'Segoe UI',sans-serif;
}

body{
background:
linear-gradient(
180deg,
#0b1f3a,
#1565c0,
#42a5f5
);
min-height:100vh;
color:white;
overflow-x:hidden;
padding-bottom:120px;
}

/* HEADER */

.header{
position:relative;
height:220px;
overflow:hidden;
}

.wave{
width:100%;
height:220px;
object-fit:cover;
}

.logo-box{
position:absolute;
top:20px;
left:15px;
display:flex;
align-items:center;
gap:10px;
}

.logo{
width:60px;
height:60px;
border-radius:50%;
padding:5px;
object-fit:cover;
background:white;
}

.logo-box h1{
font-size:18px;
}

/* CONTAINER */

.container{
padding:15px;
}

/* MENU */

.top-menu{
display:flex;
gap:10px;
margin-bottom:20px;
}

.nav-btn{
flex:1;
border:none;
padding:12px 5px;
border-radius:20px;
cursor:pointer;
background:rgba(255,255,255,.15);
color:white;
display:flex;
flex-direction:column;
align-items:center;
justify-content:center;
gap:5px;
font-size:12px;
}

.active-nav{
background:
linear-gradient(
45deg,
#00c6ff,
#0072ff
);
}

/* CARD */

.card{
background:rgba(255,255,255,.12);
border-radius:25px;
padding:20px;
margin-bottom:20px;
}

/* INPUT */

input,select{
width:100%;
padding:12px;
border:none;
border-radius:15px;
margin-top:10px;
font-size:13px;
outline:none;
background:rgba(255,255,255,.10);
color:white;
}

/* BUTTON */

.main-btn{
width:100%;
padding:15px;
border:none;
border-radius:18px;
margin-top:15px;
font-size:16px;
font-weight:bold;
color:white;
cursor:pointer;
background:
linear-gradient(
45deg,
#00c6ff,
#0072ff
);
}

/* STUDENT */

.student{
display:flex;
justify-content:space-between;
align-items:center;
background:rgba(255,255,255,.1);
padding:12px;
border-radius:18px;
margin-top:10px;
font-size:12px;
}

/* STATUS */

.status-group{
display:flex;
gap:4px;
}

.status-btn{
width:32px;
height:32px;
border:none;
border-radius:50%;
background:
linear-gradient(
45deg,
#2196f3,
#1565c0
);
color:white;
font-weight:bold;
cursor:pointer;
}

.status-active{
background:
linear-gradient(
45deg,
#00e676,
#00c853
)!important;
}

/* SECTION */

.section{
display:none;
}

.active{
display:block;
}

/* PREVIEW */

.preview-box{
background:rgba(255,255,255,.12);
padding:15px;
border-radius:18px;
margin-top:20px;
line-height:1.8;
}

/* NOTIF */

.notif{
position:fixed;
top:15px;
left:50%;
transform:translateX(-50%);
background:
linear-gradient(
45deg,
#00c853,
#64dd17
);
padding:15px 20px;
border-radius:15px;
z-index:9999;
font-weight:bold;
}

canvas{
background:white;
border-radius:15px;
padding:10px;
margin-top:10px;
height:300px !important;
}

.copy-btn{
padding:10px;
border:none;
border-radius:10px;
background:#00c6ff;
color:white;
margin-top:10px;
cursor:pointer;
}

</style>
</head>

<body>

<!-- HEADER -->

<div class="header">

<img class="wave"
src="https://images.unsplash.com/photo-1507525428034-b723cf961d3e?q=80&w=1200&auto=format&fit=crop">

<div class="logo-box">

<img class="logo"
src="https://upload.wikimedia.org/wikipedia/commons/a/a7/React-icon.svg">

<h1>
SMK NEGERI 1 SANDEN
</h1>

</div>
</div>

<div class="container">

<!-- MENU -->

<div class="top-menu">

<button class="nav-btn active-nav"
onclick="showPage('presensi',this)">
<i class="fa-solid fa-clipboard-check"></i>
<span>Presensi</span>
</button>

<button class="nav-btn"
onclick="showPage('dataPage',this)">
<i class="fa-solid fa-chart-column"></i>
<span>Data</span>
</button>

</div>

<!-- PRESENSI -->

<div id="presensi"
class="section active">

<div class="card">

<h2>Presensi Harian</h2>

<select id="guru"></select>

<input
type="password"
id="pin"
placeholder="PIN"
oninput="cekPIN()">

<select id="kelas"
style="display:none;">
</select>

<div id="siswaContainer"
style="display:none;">
</div>

<div class="preview-box">

<h3>Preview Presensi</h3>

<div id="previewPresensi">
Belum ada data presensi
</div>

</div>

<button class="main-btn"
onclick="kirimPresensi()">
Kirim Presensi
</button>

<button class="main-btn"
onclick="copyPreviewPresensi()">
Copy Laporan
</button>

</div>
</div>

<!-- DATA -->

<div id="dataPage"
class="section">

<div class="card">

<h2>Grafik Harian</h2>

<canvas id="grafikHarian"></canvas>

</div>

<div class="card">

<h2>Kelas Belum Presensi</h2>

<div id="kelasBelum"></div>

<button class="copy-btn"
onclick="copyBelum()">
Copy
</button>

</div>

</div>

</div>

<script>

/* =========================
CONFIG
========================= */

const WEB_APP_URL =
"https://script.google.com/macros/s/AKfycbyfyySEKok0yLosiq34kVXzdIFmEQAiZASmEe0yrHGocMGfwY2bT57xLVNtlPhSkPaXlQ/exec";

/* =========================
GLOBAL
========================= */

let siswa = [];
let guru = [];
let presensi = [];
let chartHarian = null;

/* =========================
LOAD DATA
========================= */

async function loadData(){

try{

const response =
await fetch(WEB_APP_URL);

const result =
await response.json();

siswa = result.siswa || [];

guru = result.guru || [];

loadGuru();

loadKelas();

loadBelum();

showNotif(
"Data berhasil dimuat"
);

}catch(err){

console.log(err);

showNotif(
"Gagal mengambil data"
);

}

}

/* =========================
LOAD GURU
========================= */

function loadGuru(){

let html='';

guru.forEach(g=>{

html += `
<option>
${g.nama}
</option>
`;

});

document
.getElementById('guru')
.innerHTML = html;

}

/* =========================
LOAD KELAS
========================= */

function loadKelas(){

let kelas = [

...new Set(
siswa.map(x=>x.kelas)
)

];

let html='';

kelas.forEach(k=>{

html += `
<option>
${k}
</option>
`;

});

document
.getElementById('kelas')
.innerHTML = html;

showStudents();

document
.getElementById('kelas')
.addEventListener(
'change',
showStudents
);

}

/* =========================
CEK PIN
========================= */

function cekPIN(){

const pin =
document
.getElementById('pin')
.value;

if(pin.length >= 4){

document
.getElementById('kelas')
.style.display='block';

document
.getElementById('siswaContainer')
.style.display='block';

}else{

document
.getElementById('kelas')
.style.display='none';

document
.getElementById('siswaContainer')
.style.display='none';

}

}

/* =========================
SHOW STUDENT
========================= */

function showStudents(){

const kelas =
document
.getElementById('kelas')
.value;

const filtered =
siswa.filter(
x=>x.kelas==kelas
);

let html='';

filtered.forEach((s,index)=>{

html += `

<div class="student">

<div>
${s.no}. ${s.nama}
</div>

<div class="status-group">

<button
class="status-btn"
onclick="setStatus(event,${index},'S')">
S
</button>

<button
class="status-btn"
onclick="setStatus(event,${index},'I')">
I
</button>

<button
class="status-btn"
onclick="setStatus(event,${index},'A')">
A
</button>

<button
class="status-btn"
onclick="setStatus(event,${index},'D')">
D
</button>

</div>

</div>

`;

});

document
.getElementById(
'siswaContainer'
)
.innerHTML = html;

}

/* =========================
SET STATUS
========================= */

function setStatus(event,index,status){

const kelas =
document
.getElementById('kelas')
.value;

const filtered =
siswa.filter(
x=>x.kelas==kelas
);

const selected =
filtered[index];

const parent =
event.target.parentElement;

parent
.querySelectorAll('.status-btn')
.forEach(btn=>{
btn.classList.remove('status-active');
});

event.target
.classList.add('status-active');

const existing =
presensi.find(
p=>p.nama==selected.nama
);

if(existing){

existing.status=status;

}else{

presensi.push({

nama:selected.nama,
kelas,
status

});

}

updatePreview();

}

/* =========================
UPDATE PREVIEW
========================= */

function updatePreview(){

let html='';

if(presensi.length==0){

html='Belum ada data';

}else{

presensi.forEach((p,i)=>{

html += `
${i+1}. ${p.nama} - ${p.status}<br>
`;

});

}

document
.getElementById(
'previewPresensi'
)
.innerHTML = html;

loadBelum();

buatGrafik();

}

/* =========================
KIRIM PRESENSI
========================= */

async function kirimPresensi(){

const pin =
document
.getElementById('pin')
.value;

if(pin.length < 4){

showNotif(
"PIN minimal 4 digit"
);

return;

}

if(presensi.length==0){

showNotif(
"Belum ada data presensi"
);

return;

}

try{

const formData =
new FormData();

formData.append(

'data',

JSON.stringify({

guru:
document
.getElementById('guru').value,

kelas:
document
.getElementById('kelas').value,

data:presensi

})

);

await fetch(
WEB_APP_URL,
{
method:'POST',
body:formData
}
);

showNotif(
"Presensi berhasil dikirim"
);

presensi=[];

updatePreview();

document
.querySelectorAll('.status-btn')
.forEach(btn=>{
btn.classList.remove('status-active');
});

}catch(err){

console.log(err);

showNotif(
"Gagal mengirim"
);

}

}

/* =========================
GRAFIK
========================= */

function buatGrafik(){

const harian =
document.getElementById(
'grafikHarian'
);

if(!harian) return;

const jumlahS =
presensi.filter(
x=>x.status=='S'
).length;

const jumlahI =
presensi.filter(
x=>x.status=='I'
).length;

const jumlahA =
presensi.filter(
x=>x.status=='A'
).length;

const jumlahD =
presensi.filter(
x=>x.status=='D'
).length;

if(chartHarian){
chartHarian.destroy();
}

chartHarian =
new Chart(harian,{

type:'bar',

data:{

labels:[
'Sakit',
'Izin',
'Alpha',
'Dispensasi'
],

datasets:[{

label:'Ketidakhadiran',

data:[
jumlahS,
jumlahI,
jumlahA,
jumlahD
]

}]

},

options:{
responsive:true,
maintainAspectRatio:false
}

});

}

/* =========================
BELUM PRESENSI
========================= */

function loadBelum(){

const semuaKelas = [

...new Set(
siswa.map(x=>x.kelas)
)

];

const kelasSudah = [

...new Set(
presensi.map(x=>x.kelas)
)

];

const belum = semuaKelas.filter(
k=>!kelasSudah.includes(k)
);

let html='';

if(belum.length==0){

html='Semua kelas sudah presensi';

}else{

html = belum.join(', ');

}

document
.getElementById(
'kelasBelum'
)
.innerHTML = html;

}

/* =========================
COPY
========================= */

function copyBelum(){

navigator.clipboard.writeText(

document
.getElementById('kelasBelum')
.innerText

);

showNotif(
"Data dicopy"
);

}

function copyPreviewPresensi(){

navigator.clipboard.writeText(

document
.getElementById(
'previewPresensi'
)
.innerText

);

showNotif(
"Laporan dicopy"
);

}

/* =========================
SHOW PAGE
========================= */

function showPage(id,el){

document
.querySelectorAll('.section')
.forEach(x=>{
x.classList.remove('active');
});

document
.getElementById(id)
.classList.add('active');

document
.querySelectorAll('.nav-btn')
.forEach(btn=>{
btn.classList.remove('active-nav');
});

el.classList.add('active-nav');

if(id=="dataPage"){

setTimeout(()=>{
buatGrafik();
},300);

}

}

/* =========================
NOTIF
========================= */

function showNotif(text){

const div =
document.createElement('div');

div.className='notif';

div.innerHTML=text;

document.body.appendChild(div);

setTimeout(()=>{
div.remove();
},3000);

}

/* =========================
INIT
========================= */

loadData();

</script>

</body>
</html>
