<!DOCTYPE html>
<html lang="id">
<head>

<meta charset="UTF-8">
<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>Presensi SMKN 1 Sanden</title>

<link rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:'Segoe UI',sans-serif;
}

body{

background:
linear-gradient(
180deg,
#0b1f3a,
#1565c0,
#42a5f5
);

min-height:100vh;

color:white;

overflow-x:hidden;

padding-bottom:120px;
}

/* HEADER */

.header{

position:relative;

height:220px;

overflow:hidden;
}

.wave{

width:100%;

height:220px;

object-fit:cover;
}

.logo-box{

position:absolute;

top:20px;
left:15px;

display:flex;
align-items:center;
gap:10px;
}

.logo{

width:55px;
height:55px;

border-radius:50%;

background:white;

padding:5px;
}

.logo-box h1{

font-size:18px;

text-shadow:
0 3px 10px rgba(0,0,0,.5);
}

/* CONTAINER */

.container{
padding:15px;
}

/* MENU */

.top-menu{

display:flex;

gap:10px;

margin-bottom:20px;
}

.nav-btn{

flex:1;

border:none;

padding:12px 5px;

border-radius:20px;

cursor:pointer;

background:
rgba(255,255,255,.15);

color:white;

display:flex;

flex-direction:column;

align-items:center;

justify-content:center;

gap:5px;

transition:.4s;

font-size:12px;

backdrop-filter:blur(10px);
}

.nav-btn i{
font-size:18px;
}

.active-nav{

background:
linear-gradient(
45deg,
#00c6ff,
#0072ff
);

transform:
translateY(-3px)
scale(1.03);

box-shadow:
0 10px 25px rgba(0,0,0,.3);
}

/* CARD */

.card{

background:
rgba(255,255,255,.12);

border:
1px solid rgba(255,255,255,.2);

backdrop-filter:blur(14px);

border-radius:25px;

padding:20px;

margin-bottom:20px;

box-shadow:
0 10px 30px rgba(0,0,0,.25),
inset 0 1px 1px rgba(255,255,255,.2);
}

/* INPUT */

input,select{

width:100%;

padding:15px;

border:none;

border-radius:15px;

margin-top:10px;

font-size:16px;

outline:none;
}

/* BUTTON */

.main-btn{

width:100%;

padding:15px;

border:none;

border-radius:18px;

margin-top:15px;

font-size:16px;

font-weight:bold;

color:white;

cursor:pointer;

background:
linear-gradient(
45deg,
#00c6ff,
#0072ff
);

transition:.4s;

box-shadow:
0 8px 25px rgba(0,0,0,.3);
}

.main-btn:hover{

transform:
translateY(-3px)
scale(1.01);
}

/* SISWA */

.student{

display:flex;

justify-content:space-between;

align-items:center;

background:
rgba(255,255,255,.1);

padding:12px;

border-radius:18px;

margin-top:10px;
}

/* STATUS */

.status-group{
display:flex;
gap:7px;
}

.status-btn{

width:42px;
height:42px;

border:none;

border-radius:50%;

background:
linear-gradient(
45deg,
#2196f3,
#1565c0
);

color:white;

font-weight:bold;

cursor:pointer;

transition:.3s;

position:relative;

overflow:hidden;
}

.status-btn::before{

content:'';

position:absolute;

width:100%;
height:100%;

background:
rgba(255,255,255,.25);

top:-100%;
left:0;

transition:.4s;
}

.status-btn:hover::before{
top:0;
}

.status-active{

background:
linear-gradient(
45deg,
#00e676,
#00c853
)!important;

transform:
scale(1.15);

box-shadow:
0 0 20px rgba(0,255,100,.6);
}

/* SECTION */

.section{
display:none;
}

.active{
display:block;
}

/* WA */

.floating-wa{

position:fixed;

right:20px;
bottom:20px;

width:65px;
height:65px;

border-radius:50%;

background:#25D366;

display:flex;
align-items:center;
justify-content:center;

font-size:30px;

color:white;

text-decoration:none;

box-shadow:
0 5px 25px rgba(0,0,0,.4);

z-index:999;
}

.wa-group{

position:fixed;

left:20px;
bottom:20px;

width:65px;
height:65px;

border-radius:50%;

background:#25D366;

display:flex;
align-items:center;
justify-content:center;

font-size:30px;

color:white;

text-decoration:none;

box-shadow:
0 5px 25px rgba(0,0,0,.4);

z-index:999;
}

/* NOTIF */

.notif{

position:fixed;

top:15px;
left:50%;

transform:
translateX(-50%);

background:
linear-gradient(
45deg,
#00c853,
#64dd17
);

padding:15px 20px;

border-radius:15px;

z-index:9999;

font-weight:bold;

box-shadow:
0 10px 25px rgba(0,0,0,.3);

animation:
slideNotif .5s ease;
}

@keyframes slideNotif{

from{
opacity:0;

transform:
translateX(-50%)
translateY(-20px);
}

to{
opacity:1;

transform:
translateX(-50%)
translateY(0);
}

}

/* PREVIEW */

.preview-box{

background:
rgba(255,255,255,.12);

padding:15px;

border-radius:18px;

margin-top:20px;

line-height:1.8;
}

/* ULTAH */

.birthday{

background:
linear-gradient(
45deg,
#ff9800,
#ff5722
);

padding:15px;

border-radius:20px;

margin-bottom:15px;

animation:pulse 1.5s infinite;
}

@keyframes pulse{

0%{
transform:scale(1);
}

50%{
transform:scale(1.03);
}

100%{
transform:scale(1);
}

}

/* COPY */

.copy-btn{

padding:10px;

border:none;

border-radius:10px;

background:#00c6ff;

color:white;

margin-top:10px;

cursor:pointer;
}

/* CHART */

canvas{

background:white;

border-radius:15px;

padding:10px;

margin-top:10px;
}

</style>

</head>

<body>

<!-- HEADER -->

<div class="header">

<img class="wave"
src="https://images.unsplash.com/photo-1507525428034-b723cf961d3e?q=80&w=1200&auto=format&fit=crop">

<div class="logo-box">

<img class="logo"
src="https://upload.wikimedia.org/wikipedia/commons/a/a7/React-icon.svg">

<h1>
SMK NEGERI 1 SANDEN
</h1>

</div>
</div>

<div class="container">

<!-- MENU -->

<div class="top-menu">

<button class="nav-btn active-nav"
onclick="showPage('presensi',this)">

<i class="fa-solid fa-clipboard-check"></i>

<span>Presensi</span>

</button>

<button class="nav-btn"
onclick="showPage('admin',this)">

<i class="fa-solid fa-user-shield"></i>

<span>Admin</span>

</button>

<button class="nav-btn"
onclick="showPage('data',this)">

<i class="fa-solid fa-database"></i>

<span>Data</span>

</button>

</div>

<!-- PRESENSI -->

<div id="presensi"
class="section active">

<div id="birthdayBox"></div>

<div class="card">

<h2>Presensi Harian</h2>

<select id="guru"></select>

<input type="password"
id="pin"
placeholder="PIN tetap guru">

<select id="kelas"></select>

<div id="siswaContainer"></div>

<div style="margin-top:15px;">

<b>Keterangan:</b><br>

S = Sakit<br>
I = Izin<br>
A = Alpha<br>
D = Dispensasi

</div>

<div class="preview-box">

<h3>Preview Presensi</h3>

<div id="previewPresensi">

Belum ada data

</div>

</div>

<button class="main-btn"
onclick="kirimPresensi()">

Kirim Presensi

</button>

<button class="main-btn"
onclick="revisiPresensi()">

Revisi Presensi

</button>

<button class="copy-btn"
onclick="copyPreviewPresensi()">

Copy Laporan

</button>

</div>

</div>

<!-- ADMIN -->

<div id="admin"
class="section">

<div class="card">

<h2>Login Admin</h2>

<input id="username"
placeholder="Username">

<input type="password"
id="password"
placeholder="Password">

<button class="main-btn"
onclick="loginAdmin()">

Login

</button>

</div>

<div id="dashboard"
style="display:none;">

<div class="card">

<h3>Data Ketidakhadiran</h3>

<div id="laporan"></div>

<button class="copy-btn"
onclick="copyLaporan()">

Copy

</button>

<button class="copy-btn"
onclick="window.print()">

Print PDF

</button>

</div>

<div class="card">

<h3>Grafik</h3>

<canvas id="grafikHarian"></canvas>

</div>

</div>

</div>

<!-- DATA -->

<div id="data"
class="section">

<div class="card">

<h2>Tambah Siswa</h2>

<input id="no"
placeholder="Nomor">

<input id="nama"
placeholder="Nama">

<input id="kelasInput"
placeholder="Kelas">

<input id="nisn"
placeholder="NISN">

<input type="date"
id="lahir">

<button class="main-btn"
onclick="simpanSiswa()">

Simpan

</button>

</div>

</div>

</div>

<!-- WA -->

<a class="floating-wa"
href="https://wa.me/628121543986">

<i class="fab fa-whatsapp"></i>

</a>

<a class="wa-group"
href="https://wa.me/?text=Presensi%20SMKN1Sanden">

<i class="fab fa-whatsapp"></i>

</a>

<script>

/* =========================================
GOOGLE SHEET
========================================= */

const WEB_APP_URL =
"https://script.google.com/macros/s/AKfycbzya5lwIFRXKGxy41Di-jDpWqcXLpwEKpXj9rrIuY81BzfH15r0VkAO82dWORAZLiHd7Q/exec";

/* =========================================
CONFIG
========================================= */

const CONFIG = {

ADMIN:{
username:"Miming",
password:"admin"
}

};

/* =========================================
DATA SISWA
========================================= */

let siswa=[

{
no:1,
nama:"Anwar",
kelas:"XRPL1",
nisn:"11111",
lahir:"2004-01-01"
},

{
no:2,
nama:"Desi",
kelas:"XRPL1",
nisn:"11112",
lahir:"2004-12-01"
}

];

/* =========================================
DATA GURU
========================================= */

let guru=[

{
nama:"Hendratmoko"
},

{
nama:"Kawit"
}

];

/* =========================================
PRESENSI
========================================= */

let presensi=[];

/* =========================================
SHOW PAGE
========================================= */

function showPage(id,el){

document
.querySelectorAll('.section')
.forEach(x=>{

x.classList.remove('active');

});

document
.getElementById(id)
.classList.add('active');

document
.querySelectorAll('.nav-btn')
.forEach(btn=>{

btn.classList.remove('active-nav');

});

el.classList.add('active-nav');

}

/* =========================================
LOAD GURU
========================================= */

function loadGuru(){

let html='';

guru.forEach(g=>{

html += `
<option>
${g.nama}
</option>
`;

});

document
.getElementById('guru')
.innerHTML = html;

}

/* =========================================
LOAD KELAS
========================================= */

function loadKelas(){

let kelas = [

...new Set(
siswa.map(x=>x.kelas)
)

];

let html='';

kelas.forEach(k=>{

html += `
<option>
${k}
</option>
`;

});

document
.getElementById('kelas')
.innerHTML = html;

showStudents();

document
.getElementById('kelas')
.addEventListener(
'change',
showStudents
);

}

/* =========================================
SHOW STUDENTS
========================================= */

function showStudents(){

const kelas =
document
.getElementById('kelas')
.value;

const filtered =
siswa.filter(
x=>x.kelas==kelas
);

let html='';

filtered.forEach((s,index)=>{

html += `

<div class="student">

<div>

${s.no}. ${s.nama}

</div>

<div class="status-group">

<button class="status-btn"
onclick="setStatus(event,${index},'S')">

S

</button>

<button class="status-btn"
onclick="setStatus(event,${index},'I')">

I

</button>

<button class="status-btn"
onclick="setStatus(event,${index},'A')">

A

</button>

<button class="status-btn"
onclick="setStatus(event,${index},'D')">

D

</button>

</div>

</div>

`;

});

document
.getElementById(
'siswaContainer'
)
.innerHTML = html;

}

/* =========================================
SET STATUS
========================================= */

function setStatus(event,index,status){

const kelas =
document
.getElementById('kelas')
.value;

const filtered =
siswa.filter(
x=>x.kelas==kelas
);

const selected =
filtered[index];

const parent =
event.target.parentElement;

const isActive =
event.target.classList.contains(
'status-active'
);

parent
.querySelectorAll('.status-btn')
.forEach(btn=>{

btn.classList.remove('status-active');

});

if(isActive){

presensi =
presensi.filter(
p=>p.nama!=selected.nama
);

updatePreview();

return;

}

event.target
.classList.add('status-active');

const existing =
presensi.find(
p=>p.nama==selected.nama
);

if(existing){

existing.status=status;

}else{

presensi.push({

nama:selected.nama,
kelas,
status

});

}

updatePreview();

}

/* =========================================
UPDATE PREVIEW
========================================= */

function updatePreview(){

let html='';

if(presensi.length==0){

html='Belum ada data';

}else{

presensi.forEach((p,i)=>{

html += `
${i+1}. ${p.nama}
 - ${p.status}<br>
`;

});

}

document
.getElementById(
'previewPresensi'
)
.innerHTML = html;

}

/* =========================================
KIRIM PRESENSI
========================================= */

async function kirimPresensi(){

if(presensi.length==0){

showNotif(
"Belum ada data presensi"
);

return;

}

try{

const response =
await fetch(WEB_APP_URL,{

method:'POST',

headers:{
'Content-Type':
'application/json'
},

body:JSON.stringify({

tanggal:
new Date(),

guru:
document
.getElementById('guru').value,

kelas:
document
.getElementById('kelas').value,

data:presensi

})

});

const result =
await response.json();

if(result.result=='success'){

showNotif(
"Presensi berhasil dikirim"
);

buatLaporan();

}else{

showNotif(
"Gagal mengirim"
);

}

}catch(err){

console.log(err);

showNotif(
"Error koneksi"
);

}

}

/* =========================================
LAPORAN
========================================= */

function buatLaporan(){

let laporan =
"Presensi Kehadiran SMKN 1 Sanden\n\n";

presensi.forEach((p,i)=>{

laporan +=
`${i+1}. ${p.nama} /${p.status}\n`;

});

document
.getElementById('laporan')
.innerHTML =
laporan.replace(/\n/g,'<br>');

}

/* =========================================
REVISI
========================================= */

function revisiPresensi(){

showNotif(
"Revisi berhasil"
);

}

/* =========================================
LOGIN ADMIN
========================================= */

function loginAdmin(){

const u =
document
.getElementById('username')
.value;

const p =
document
.getElementById('password')
.value;

if(
u==
CONFIG.ADMIN.username
&&
p==
CONFIG.ADMIN.password
){

document
.getElementById(
'dashboard'
)
.style.display='block';

loadGrafik();

showNotif(
"Login berhasil"
);

}else{

showNotif(
"Login gagal"
);

}

}

/* =========================================
COPY
========================================= */

function copyLaporan(){

navigator.clipboard.writeText(

document
.getElementById('laporan')
.innerText

);

showNotif(
"Laporan dicopy"
);

}

function copyPreviewPresensi(){

navigator.clipboard.writeText(

document
.getElementById(
'previewPresensi'
)
.innerText

);

showNotif(
"Laporan dicopy"
);

}

/* =========================================
GRAFIK
========================================= */

function loadGrafik(){

new Chart(
document.getElementById('grafikHarian'),
{
type:'bar',
data:{
labels:['S','I','A','D'],
datasets:[{
label:'Harian',
data:[5,2,1,3]
}]
}
});

}

/* =========================================
SIMPAN SISWA
========================================= */

async function simpanSiswa(){

const dataSiswa = {

no:
document
.getElementById('no').value,

nama:
document
.getElementById('nama').value,

kelas:
document
.getElementById('kelasInput').value,

nisn:
document
.getElementById('nisn').value,

lahir:
document
.getElementById('lahir').value

};

siswa.push(dataSiswa);

try{

await fetch(WEB_APP_URL,{

method:'POST',

headers:{
'Content-Type':
'application/json'
},

body:JSON.stringify({

action:'tambahSiswa',

data:dataSiswa

})

});

showNotif(
"Siswa berhasil disimpan"
);

}catch(err){

showNotif(
"Gagal menyimpan"
);

}

loadKelas();

}

/* =========================================
NOTIF
========================================= */

function showNotif(text){

const div =
document.createElement('div');

div.className='notif';

div.innerHTML=text;

document.body.appendChild(div);

setTimeout(()=>{

div.remove();

},3000);

}

/* =========================================
INIT
========================================= */

loadGuru();

loadKelas();

</script>

</body>
</html>
