<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>Presensi SMKN 1 Sanden</title>

<link rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:'Segoe UI',sans-serif;
}

body{
background:
linear-gradient(
180deg,
#0b1f3a,
#1565c0,
#42a5f5
);
min-height:100vh;
color:white;
overflow-x:hidden;
padding-bottom:100px;
}

.header{
position:relative;
height:220px;
overflow:hidden;
}

.wave{
width:100%;
height:220px;
object-fit:cover;
}

.logo-box{
position:absolute;
top:20px;
left:15px;
display:flex;
align-items:center;
gap:10px;
}

.logo{
width:55px;
height:55px;
border-radius:50%;
background:white;
padding:5px;
}

.logo-box h1{
font-size:18px;
text-shadow:
0 3px 10px rgba(0,0,0,.5);
}

.container{
padding:15px;
}

.card{
background:
rgba(255,255,255,.12);

border:
1px solid rgba(255,255,255,.2);

backdrop-filter:blur(15px);

border-radius:25px;

padding:20px;

margin-bottom:20px;

box-shadow:
0 10px 30px rgba(0,0,0,.25),
inset 0 1px 1px rgba(255,255,255,.2);
}

.menu{
display:flex;
gap:10px;
margin-bottom:15px;
}

.menu button{
flex:1;
}

input,select{
width:100%;
padding:15px;
border:none;
border-radius:15px;
margin-top:10px;
font-size:16px;
outline:none;
}

.main-btn{
width:100%;
padding:15px;
border:none;
border-radius:18px;
margin-top:15px;
font-size:16px;
font-weight:bold;
color:white;
cursor:pointer;

background:
linear-gradient(
45deg,
#00c6ff,
#0072ff
);

transition:.4s;

box-shadow:
0 8px 25px rgba(0,0,0,.3);
}

.main-btn:hover{
transform:
translateY(-3px)
scale(1.01);
}

.student{
display:flex;
justify-content:space-between;
align-items:center;

background:
rgba(255,255,255,.1);

padding:12px;

border-radius:18px;

margin-top:10px;
}

.status-group{
display:flex;
gap:7px;
}

.status-btn{
width:40px;
height:40px;
border:none;
border-radius:50%;
font-weight:bold;
color:white;
cursor:pointer;
transition:.3s;
}

.status-btn:hover{
transform:scale(1.15);
}

.s{
background:#f39c12;
}

.i{
background:#3498db;
}

.a{
background:#e74c3c;
}

.d{
background:#2ecc71;
}

.section{
display:none;
}

.active{
display:block;
}

.floating-wa{
position:fixed;
right:20px;
bottom:20px;
width:65px;
height:65px;
border-radius:50%;
background:#25D366;
display:flex;
align-items:center;
justify-content:center;
font-size:30px;
color:white;
text-decoration:none;
box-shadow:
0 5px 25px rgba(0,0,0,.4);
z-index:999;
}

.small{
font-size:13px;
opacity:.8;
margin-top:5px;
}

canvas{
background:white;
border-radius:15px;
padding:10px;
}

.copy-btn{
padding:10px;
border:none;
border-radius:10px;
background:#00c6ff;
color:white;
margin-top:10px;
cursor:pointer;
}

.birthday{
background:
linear-gradient(
45deg,
#ff9800,
#ff5722
);

padding:15px;

border-radius:20px;

margin-bottom:15px;

animation:pulse 1.5s infinite;
}

@keyframes pulse{

0%{
transform:scale(1);
}

50%{
transform:scale(1.03);
}

100%{
transform:scale(1);
}

}

</style>
</head>

<body>

<div class="header">

<img class="wave"
src="https://images.unsplash.com/photo-1507525428034-b723cf961d3e?q=80&w=1200&auto=format&fit=crop">

<div class="logo-box">

<img class="logo"
src="https://upload.wikimedia.org/wikipedia/commons/a/a7/React-icon.svg">

<h1>
SMK NEGERI 1 SANDEN
</h1>

</div>
</div>

<div class="container">

<div class="menu">

<button class="main-btn"
onclick="showPage('presensi')">
Presensi
</button>

<button class="main-btn"
onclick="showPage('admin')">
Admin
</button>

<button class="main-btn"
onclick="showPage('data')">
Data
</button>

</div>

<!-- PRESENSI -->

<div id="presensi"
class="section active">

<div id="birthdayBox"></div>

<div class="card">

<h2>Presensi Harian</h2>

<select id="guru"></select>

<input type="password"
id="pin"
placeholder="PIN tetap guru">

<div class="small">
Buat PIN 4 digit huruf/angka
yang selalu dipakai dan
tidak boleh berubah
</div>

<select id="kelas"></select>

<div id="siswaContainer"></div>

<div style="margin-top:15px;">

<b>Keterangan:</b><br>

S = Sakit<br>
I = Izin<br>
A = Alpha<br>
D = Dispensasi

</div>

<button class="main-btn"
onclick="kirimPresensi()">

Kirim Presensi

</button>

<button class="main-btn"
onclick="revisiPresensi()">

Revisi Presensi

</button>

</div>

</div>

<!-- ADMIN -->

<div id="admin"
class="section">

<div class="card">

<h2>Login Admin</h2>

<input id="username"
placeholder="Username">

<input type="password"
id="password"
placeholder="Password">

<button class="main-btn"
onclick="loginAdmin()">

Login

</button>

</div>

<div id="dashboard"
style="display:none;">

<div class="card">

<h3>
Data Ketidakhadiran Hari Ini
</h3>

<div id="laporan"></div>

<button class="copy-btn"
onclick="copyLaporan()">

Copy Laporan

</button>

</div>

<div class="card">

<h3>
Kelas Belum Presensi
</h3>

<div id="belum"></div>

<button class="copy-btn"
onclick="copyBelum()">

Copy Data

</button>

</div>

<div class="card">

<h3>Grafik Presensi</h3>

<canvas id="grafik"></canvas>

</div>

</div>

</div>

<!-- DATA -->

<div id="data"
class="section">

<div class="card">

<h2>Tambah Siswa</h2>

<input id="no"
placeholder="Nomor">

<input id="nama"
placeholder="Nama">

<input id="kelasInput"
placeholder="Kelas">

<input id="nisn"
placeholder="NISN">

<input type="date"
id="lahir">

<button class="main-btn"
onclick="simpanSiswa()">

Simpan Siswa

</button>

</div>

<div class="card">

<h2>Tambah Guru</h2>

<input id="guruNama"
placeholder="Nama Guru">

<input type="date"
id="guruLahir">

<select id="jk">

<option>
Laki-laki
</option>

<option>
Perempuan
</option>

</select>

<button class="main-btn"
onclick="simpanGuru()">

Simpan Guru

</button>

</div>

</div>

</div>

<a class="floating-wa"
href="https://wa.me/628121543986">

<i class="fab fa-whatsapp"></i>

</a>

<script>

const CONFIG = {

WEB_APP_URL:
"PASTE_WEB_APP_URL",

ADMIN:{
username:"Miming",
password:"admin"
}

};

let siswa = [

{
no:1,
nama:"Anwar",
kelas:"XRPL1",
nisn:"11111",
lahir:"2004-01-01"
},

{
no:2,
nama:"Desi",
kelas:"XRPL1",
nisn:"11112",
lahir:"2004-12-01"
},

{
no:3,
nama:"Anwar Ismail",
kelas:"XTKJ1",
nisn:"11117",
lahir:"2004-01-05"
},

{
no:4,
nama:"Ibrahim",
kelas:"XTKJ1",
nisn:"11118",
lahir:"2003-12-01"
}

];

let guru = [

{
nama:"Hendratmoko",
lahir:"1975-11-29",
jk:"L"
},

{
nama:"Kawit",
lahir:"1969-08-30",
jk:"L"
}

];

let presensi=[];

function showPage(id){

document
.querySelectorAll('.section')
.forEach(x=>{

x.classList.remove('active');

});

document
.getElementById(id)
.classList.add('active');

}

function loadGuru(){

let html='';

guru.forEach(g=>{

html += `
<option>
${g.nama}
</option>
`;

});

document
.getElementById('guru')
.innerHTML = html;

}

function loadKelas(){

let kelas = [

...new Set(
siswa.map(x=>x.kelas)
)

];

let html='';

kelas.forEach(k=>{

html += `
<option>
${k}
</option>
`;

});

document
.getElementById('kelas')
.innerHTML = html;

showStudents();

document
.getElementById('kelas')
.addEventListener(
'change',
showStudents
);

}

function showStudents(){

const kelas =
document
.getElementById('kelas')
.value;

const filtered =
siswa.filter(
x=>x.kelas==kelas
);

let html='';

filtered.forEach((s,index)=>{

html += `

<div class="student">

<div>

${s.no}. ${s.nama}

</div>

<div class="status-group">

<button
class="status-btn s"
onclick="setStatus(${index},'S')">

S

</button>

<button
class="status-btn i"
onclick="setStatus(${index},'I')">

I

</button>

<button
class="status-btn a"
onclick="setStatus(${index},'A')">

A

</button>

<button
class="status-btn d"
onclick="setStatus(${index},'D')">

D

</button>

</div>

</div>

`;

});

document
.getElementById(
'siswaContainer'
)
.innerHTML = html;

}

function setStatus(index,status){

const kelas =
document
.getElementById('kelas')
.value;

const filtered =
siswa.filter(
x=>x.kelas==kelas
);

const selected =
filtered[index];

const existing =
presensi.find(
p=>p.nama==selected.nama
);

if(existing){

existing.status=status;

}else{

presensi.push({

nama:selected.nama,
kelas,
status

});

}

}

function kirimPresensi(){

let laporan =
"Presensi Kehadiran SMKN 1 Sanden\n\n";

presensi.forEach((p,i)=>{

laporan +=
`${i+1}. ${p.nama} /${p.status}\n`;

});

alert(
"Presensi berhasil dikirim"
);

document
.getElementById('laporan')
.innerHTML =
laporan.replace(/\n/g,'<br>');

}

function revisiPresensi(){

alert(
"Revisi berhasil dikirim"
);

}

function loginAdmin(){

const u =
document
.getElementById('username')
.value;

const p =
document
.getElementById('password')
.value;

if(
u==
CONFIG.ADMIN.username
&&
p==
CONFIG.ADMIN.password
){

document
.getElementById(
'dashboard'
)
.style.display='block';

loadGrafik();

loadBelum();

}else{

alert(
"Login gagal"
);

}

}

function loadBelum(){

document
.getElementById('belum')
.innerHTML =

`
1. XI RPL 1<br>
2. XI TKJ 2<br>
3. XII TKJ 1
`;

}

function copyLaporan(){

navigator.clipboard.writeText(

document
.getElementById('laporan')
.innerText

);

alert(
"Laporan dicopy"
);

}

function copyBelum(){

navigator.clipboard.writeText(

document
.getElementById('belum')
.innerText

);

alert(
"Data dicopy"
);

}

function loadGrafik(){

const ctx =
document
.getElementById('grafik');

new Chart(ctx,{

type:'bar',

data:{

labels:[
'S',
'I',
'A',
'D'
],

datasets:[{

label:'Jumlah',

data:[
5,
2,
1,
3
]

}]

}

});

}

function simpanSiswa(){

siswa.push({

no:
document
.getElementById('no')
.value,

nama:
document
.getElementById('nama')
.value,

kelas:
document
.getElementById('kelasInput')
.value,

nisn:
document
.getElementById('nisn')
.value,

lahir:
document
.getElementById('lahir')
.value

});

alert(
"Siswa berhasil ditambahkan"
);

loadKelas();

}

function simpanGuru(){

guru.push({

nama:
document
.getElementById('guruNama')
.value,

lahir:
document
.getElementById('guruLahir')
.value,

jk:
document
.getElementById('jk')
.value

});

alert(
"Guru berhasil ditambahkan"
);

loadGuru();

}

function cekUltah(){

const hariIni =
new Date();

const tanggal =
hariIni.getDate();

const bulan =
hariIni.getMonth()+1;

let html='';

siswa.forEach(s=>{

const lahir =
new Date(s.lahir);

if(
lahir.getDate()==tanggal
&&
lahir.getMonth()+1==bulan
){

html += `

<div class="birthday">

🎉 Selamat ulang tahun
${s.nama}

</div>

`;

}

});

document
.getElementById(
'birthdayBox'
)
.innerHTML = html;

}

loadGuru();

loadKelas();

cekUltah();

</script>

</body>
</html>
