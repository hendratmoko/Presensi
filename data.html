<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>Data Master</title>

<link rel="stylesheet" href="style.css">

</head>
<body>

<div class="container">

<div class="card">

<h2>Tambah Siswa</h2>

<input id="no" placeholder="Nomor">
<input id="nama" placeholder="Nama">
<input id="kelas" placeholder="Kelas">
<input id="nisn" placeholder="NISN">
<input type="date" id="lahir">

<button class="main-btn"
onclick="simpanSiswa()">
Simpan Siswa
</button>

</div>

<div class="card">

<h2>Tambah Guru</h2>

<input id="guruNama"
placeholder="Nama Guru">

<input type="date"
id="guruLahir">

<select id="jk">
<option>Laki-laki</option>
<option>Perempuan</option>
</select>

<button class="main-btn"
onclick="simpanGuru()">
Simpan Guru
</button>

</div>

</div>

<script src="config.js"></script>
<script src="data.js"></script>

</body>
</html>
