<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>Admin Dashboard</title>

<link rel="stylesheet" href="style.css">

<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

</head>
<body>

<div class="container">

<div class="card">

<h2>Admin Login</h2>

<input id="username"
placeholder="Username">

<input type="password"
id="password"
placeholder="Password">

<button class="main-btn"
onclick="loginAdmin()">
Login
</button>

</div>

<div id="dashboard"
style="display:none;">

<div class="card">
<h3>Laporan Hari Ini</h3>
<div id="laporan"></div>
</div>

<div class="card">
<h3>Kelas Belum Presensi</h3>
<div id="belum"></div>
</div>

<div class="card">
<h3>Grafik Presensi</h3>
<canvas id="grafik"></canvas>
</div>

</div>

</div>

<script src="config.js"></script>
<script src="admin.js"></script>

</body>
</html>
